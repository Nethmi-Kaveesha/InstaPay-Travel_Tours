<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom styling */
        th {
            cursor: pointer;
        }
        .badge-succeeded {
            background-color: green;
            color: white;
        }
        .badge-failed {
            background-color: red;
            color: white;
        }
        #pagination {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2>Payment Records</h2>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead class="table-dark">
            <tr>
                <th onclick="sortTable('id')">ID ⬍</th>
                <th onclick="sortTable('amount')">Amount ⬍</th>
                <th>Email</th>
                <th>Payment ID</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody id="paymentTableBody">
            <!-- Table rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <div id="pagination">
        <button onclick="changePage('prev')" class="btn btn-primary">Previous</button>
        <button onclick="changePage('next')" class="btn btn-primary">Next</button>
    </div>

    <p id="pageInfo"></p>
</div>

<script>
    // Example payments data (mocked)
    const allPayments = [
        { id: 1, amount: 100, email: 'user1@example.com', paymentId: 'abc123', status: 'succeeded' },
        { id: 2, amount: 150, email: 'user2@example.com', paymentId: 'def456', status: 'failed' },
        { id: 3, amount: 200, email: 'user3@example.com', paymentId: 'ghi789', status: 'succeeded' },
        { id: 4, amount: 250, email: 'user4@example.com', paymentId: 'jkl012', status: 'failed' },
        { id: 5, amount: 300, email: 'user5@example.com', paymentId: 'mno345', status: 'succeeded' },
        { id: 6, amount: 350, email: 'user6@example.com', paymentId: 'pqr678', status: 'failed' },
        { id: 7, amount: 400, email: 'user7@example.com', paymentId: 'stu901', status: 'succeeded' },
        { id: 8, amount: 450, email: 'user8@example.com', paymentId: 'vwx234', status: 'failed' },
        { id: 9, amount: 500, email: 'user9@example.com', paymentId: 'yzx567', status: 'succeeded' },
        { id: 10, amount: 550, email: 'user10@example.com', paymentId: 'abc890', status: 'failed' },
        // Add more payments as needed
    ];

    let currentPage = 1;
    const rowsPerPage = 3; // Number of records per page
    let currentSort = { field: '', asc: true };

    // Render the table based on the current data and pagination
    function renderTable() {
        const tbody = document.getElementById('paymentTableBody');
        tbody.innerHTML = "";

        // Sort the data before rendering
        const sortedPayments = [...allPayments].sort((a, b) => {
            if (currentSort.field === 'id') {
                return currentSort.asc ? a.id - b.id : b.id - a.id;
            } else if (currentSort.field === 'amount') {
                return currentSort.asc ? a.amount - b.amount : b.amount - a.amount;
            }
            return 0;  // Default (no sorting)
        });

        // Paginate the sorted data
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const paginatedPayments = sortedPayments.slice(startIndex, endIndex);

        // Render the paginated data
        paginatedPayments.forEach(p => {
            const statusClass = p.status === 'succeeded' ? 'badge-succeeded' : 'badge-failed';
            const row = `<tr>
                <td>${p.id}</td>
                <td>${p.amount}</td>
                <td>${p.email}</td>
                <td>${p.paymentId}</td>
                <td><span class="badge ${statusClass}">${p.status}</span></td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });

        // Update pagination info
        document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${Math.ceil(allPayments.length / rowsPerPage)}`;
    }

    // Handle sorting when a table header is clicked
    function sortTable(field) {
        const isAscending = currentSort.field === field && currentSort.asc;
        currentSort = { field, asc: !isAscending };  // Toggle the sort order
        renderTable();  // Re-render the table based on the new sort order
    }

    // Change page (previous or next)
    function changePage(direction) {
        if (direction === 'prev' && currentPage > 1) {
            currentPage--;
        } else if (direction === 'next' && currentPage < Math.ceil(allPayments.length / rowsPerPage)) {
            currentPage++;
        }
        renderTable();  // Re-render the table based on the new page
    }

    // Initial rendering of the table
    renderTable();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
