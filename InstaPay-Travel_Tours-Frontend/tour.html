<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <title>Tour Form</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="css/bootstrap.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #A8D8E8, #D0F0C0);
            margin: 0;
            padding: 0;
        }

        .card {
            border: 2px solid white;
            margin-top: 120px;
            border-radius: 12px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.3); /* Semi-transparent white background */
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1); /* Optional: Light shadow */
            z-index: 1; /* Ensure it’s on top */
        }

        /* Table Styling */
        .table {
            width: 100%;
            margin: 0 auto;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            border: none;
        }



        thead {
            background-color: rgba(0, 172, 193, 0.8);
            color: #ffffff;
        }

        thead th {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
        }


        tbody {
            background-color: rgba(255, 255, 255, 0.5);
        }

        tbody tr {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        tbody tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.05);
        }

        tbody tr:hover {
            background-color: rgba(0, 172, 193, 0.3);
        }


        td {
            padding: 12px;
            text-align: center;
            font-size: 1rem;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
        }


        td img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .table {
                font-size: 0.875rem;
            }

            th, td {
                padding: 10px;
            }

            td img {
                width: 80px;
                height: 60px;
            }

            h4.text-center {
                font-size: 1.5rem;
            }
        }

        .navbar-top {
            background-color: black;
            color: white;
            padding: 5px 0;
            z-index: 1000;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar-top .icon {
            color: lightskyblue;
            margin-left: 10px;
        }

        .navbar-top .content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .navbar-top .content span {
            margin-right: 20px;
        }

        .social-media-icons {
            display: flex;
            justify-content: flex-end;
            margin-right: 100px;
            margin-top: -17px;
        }

        .social-media-icons a {
            color: white !important;
            margin-left: 30px;
            font-size: 16px;
        }


        .navbar {
            background-color: white;
            height: 50px;
            padding: 5px 0;
            z-index: 90999;
            width: 100%;
            position: fixed;
            top: 60px;
        }

        .navbar .navbar-nav {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .navbar .navbar-nav .nav-item {
            margin: 0 15px;
        }

        .navbar .navbar-nav .nav-item .nav-link {
            padding: 5px 10px;
            color: black;
            font-weight: bold;
        }

        .navbar .navbar-nav .nav-item .nav-link:hover {
            color: blue;
        }

        .navbar .navbar-nav .nav-item {
            margin-right: 20px;
        }

        .navbar-brand img {
            margin-left: 50px;
            height: 120px;
            margin-top: 45px;
            width: auto;
        }

        .navbar-all-in-one {
            background-color: white;
            height: 100px;

        }

        button {
            height: 50px;
            width: 100px;
            background-color: #1E90FF;
            color: #FFFFFF;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background-color: #00BFFF;
            transform: scale(1.05);
        }



    </style>
</head>
<body>
<div class="navbar-all-in-one fixed-top">
    <div class="navbar-top">
        <div class="content">
            <span><i class="fas fa-map-marker-alt icon"></i>No 333 2/2, Galle Road, Colombo 03</span>
            <span><i class="fas fa-phone icon"></i>011 257 4646</span>
            <span><i class="fas fa-link icon"></i> <a href="https://yourwebsite.com" class="text-white">marketing@travelco.lk</a></span>
        </div>
        <div class="social-media-icons">
            <a href="#" class="icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="icon"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="icon"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">
            <img src="images/Travelco-Footer-Logo.webp" alt="Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="rejister.html">Booking</a>
                </li>
            </ul>
        </div>
    </nav>
</div>
<div class="container mt-5">
    <div class="card">
        <h2 class="text-center mb-4">Tour Form</h2>
        <form id="tourForm">
            <div class="mb-3 form-floating">
                <input type="text" class="form-control" id="tourName" name="tourName" placeholder="Enter tour name" required>
                <label for="tourName">Tour Name</label>
            </div>

            <div class="mb-3 form-floating">
                <textarea class="form-control" id="description" name="description" placeholder="Enter description" rows="4"></textarea>
                <label for="description">Description</label>
            </div>

            <!-- Location and Duration fields in one line -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="location" name="location" placeholder="Enter location" required>
                        <label for="location">Location</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="duration" name="duration" placeholder="Enter duration in days" required>
                        <label for="duration">Duration (days)</label>
                    </div>
                </div>
            </div>

            <!-- Price and Tour Type fields in one line -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="price" name="price" placeholder="Enter price" required>
                        <label for="price">Price</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="tourType" name="tourType" placeholder="Enter tour type" required>
                        <label for="tourType">Tour Type</label>
                    </div>
                </div>
            </div>

            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="availableSeats" name="availableSeats" placeholder="Enter available seats" required>
                        <label for="availableSeats">Available Seats</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="startDate" name="startDate" required>
                        <label for="startDate">Start Date</label>
                    </div>
                </div>
            </div>

            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="endDate" name="endDate" required>
                        <label for="endDate">End Date</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="images" name="images" placeholder="Enter image URLs" required>
                        <label for="images">Tour Images</label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn" id="updateButton">Update</button>
                <button type="button" class="btn" id="deleteButton">Delete</button>
            </div>
        </form>
<div>
    <div>

        <div id="tables" class="mt-5">
            <h4 class="text-center">Tours List</h4>
            <table class="table table-hover mt-3">
                <thead>
                <tr>
                    <th>Tour ID</th>
                    <th>Tour Name</th>
                    <th>Description</th>
                    <th>Location</th>
                    <th>Duration</th>
                    <th>Price</th>
                    <th>Tour Type</th>
                    <th>Available Seats</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Images</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="tourTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
    </div>
</div>

<script src="js/bootstrap.js"></script>
<script src="js/tour-script.js"></script>
</body>
</html>
