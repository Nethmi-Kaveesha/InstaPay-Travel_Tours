<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <title>Tour Form</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="css/bootstrap.css" rel="stylesheet">
    <style>
        /* Body background with transparency */
        body {
            background: linear-gradient(135deg ,white, grey,white);
            margin: 0;
            padding: 0;
        }

        /* Card styles with transparent background */
        .card {
            border: 2px solid white;
            margin-top: 90px;
            border-radius: 12px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.3); /* Semi-transparent white background */
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1); /* Optional: Light shadow */
            z-index: 1; /* Ensure it’s on top */
        }

        /* Table Styling */
        .table {
            width: 100%;
            margin: 0 auto;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.3); /* Semi-transparent white background */
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1); /* Optional: Light shadow */
            border: none; /* Remove default border */
        }


        /* Table Header */
        thead {
            background-color: rgba(0, 172, 193, 0.8); /* Transparent Aqua Blue */
            color: #ffffff;
        }

        thead th {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Table Body */
        tbody {
            background-color: rgba(255, 255, 255, 0.5); /* Semi-transparent white for the body */
        }

        tbody tr {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1); /* Light border for rows */
        }

        tbody tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.05); /* Light grey for alternate rows */
        }

        /* Table Row Hover Effect */
        tbody tr:hover {
            background-color: rgba(0, 172, 193, 0.3); /* Soft transparent aqua blue for hover effect */
        }

        /* Table Cells */
        td {
            padding: 12px;
            text-align: center;
            font-size: 1rem;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7); /* Slightly opaque background for cells */
        }

        /* Images */
        td img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Action Buttons */
        td .btn {
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        /* Action Button Colors */
        td .btn-primary {
            background-color: #00acc1;
            color: #fff;
            border: none;
        }

        td .btn-primary:hover {
            background-color: #00838f; /* Darker aqua on hover */
        }

        td .btn-warning {
            background-color: #ffeb3b;
            color: #212529;
            border: none;
        }

        td .btn-warning:hover {
            background-color: #fbc02d;
        }

        td .btn-danger {
            background-color: #f44336;
            color: #fff;
            border: none;
        }

        td .btn-danger:hover {
            background-color: #d32f2f;
        }

        /* Table Responsiveness */
        @media (max-width: 768px) {
            .table {
                font-size: 0.875rem; /* Smaller font on smaller screens */
            }

            th, td {
                padding: 10px;
            }

            td img {
                width: 80px;
                height: 60px;
            }

            h4.text-center {
                font-size: 1.5rem;
            }
        }



        nav {
            background: #333;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 333310;
        }

        nav ul {
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            padding: 10px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav .logo {
            width: 150px;
            height: auto;
            margin-right: 20px;
        }

    </style>
</head>
<body>
<nav>
    <ul>
        <li><img src="images/new-logo.png" alt="Logo" class="logo"></li>
        <li><a href="#home"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="#services"><i class="fas fa-cogs"></i> Services</a></li>
        <li><a href="#about"><i class="fas fa-info-circle"></i> About Us</a></li>
        <li><a href="#team"><i class="fas fa-users"></i> Team</a></li>
        <li><a href="#contact"><i class="fas fa-envelope"></i> Contact</a></li>
        <li><a href="rejister.html"><i class="fas fa-book"></i> Booking</a></li>
    </ul>
</nav>
<div class="container mt-5">
    <div class="card">
        <h2 class="text-center mb-4">Tour Form</h2>
        <form id="tourForm">
            <div class="mb-3 form-floating">
                <input type="text" class="form-control" id="tourName" name="tourName" placeholder="Enter tour name" required>
                <label for="tourName">Tour Name</label>
            </div>

            <div class="mb-3 form-floating">
                <textarea class="form-control" id="description" name="description" placeholder="Enter description" rows="4"></textarea>
                <label for="description">Description</label>
            </div>

            <!-- Location and Duration fields in one line -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="location" name="location" placeholder="Enter location" required>
                        <label for="location">Location</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="duration" name="duration" placeholder="Enter duration in days" required>
                        <label for="duration">Duration (days)</label>
                    </div>
                </div>
            </div>

            <!-- Price and Tour Type fields in one line -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="price" name="price" placeholder="Enter price" required>
                        <label for="price">Price</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="tourType" name="tourType" placeholder="Enter tour type" required>
                        <label for="tourType">Tour Type</label>
                    </div>
                </div>
            </div>

            <!-- Available Seats and Start Date fields in one line -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="availableSeats" name="availableSeats" placeholder="Enter available seats" required>
                        <label for="availableSeats">Available Seats</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="startDate" name="startDate" required>
                        <label for="startDate">Start Date</label>
                    </div>
                </div>
            </div>

            <!-- End Date and Images fields in one line -->
            <div class="mb-3 row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="date" class="form-control" id="endDate" name="endDate" required>
                        <label for="endDate">End Date</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="images" name="images" placeholder="Enter image URLs" required>
                        <label for="images">Tour Images</label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-warning d-none" id="updateButton">Update</button>
                <button type="button" class="btn btn-danger d-none" id="deleteButton">Delete</button>
            </div>
        </form>
<div>
    <div>

        <div id="tables" class="mt-5">
            <h4 class="text-center">Tours List</h4>
            <table class="table table-hover mt-3">
                <thead>
                <tr>
                    <th>Tour ID</th>
                    <th>Tour Name</th>
                    <th>Description</th>
                    <th>Location</th>
                    <th>Duration</th>
                    <th>Price</th>
                    <th>Tour Type</th>
                    <th>Available Seats</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Images</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="tourTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
    </div>
</div>

<script src="js/bootstrap.js"></script>
<script src="js/tour-script.js"></script>
</body>
</html>
