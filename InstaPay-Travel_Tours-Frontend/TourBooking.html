<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <title>Tour Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', serif;
            background-color: #f0f0f0;
            color: #333;
            padding: 20px;
        }
        .table-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }

        nav {
            background: #333;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 333310;
        }

        nav ul {
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            padding: 10px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav .logo {
            width: 150px;
            height: auto;
            margin-right: 20px;
        }

        .remove-btn, .clear-btn, .seat-btn, .book-btn {
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .remove-btn { background-color: #e74c3c; }
        .remove-btn:hover { background-color: #c0392b; }
        .clear-btn { background-color: #e67e22; padding: 10px 20px; margin-top: 20px; }
        .clear-btn:hover { background-color: #d35400; }
        .seat-btn { background-color: #3498db; font-size: 18px; margin: 0 5px; }
        .seat-btn:hover { background-color: #2980b9; }
        .book-btn { background-color: #2ecc71; padding: 5px 15px; }
        .book-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><img src="images/new-logo.png" alt="Logo" class="logo"></li>
        <li><a href="#home"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="#services"><i class="fas fa-cogs"></i> Services</a></li>
        <li><a href="#about"><i class="fas fa-info-circle"></i> About Us</a></li>
        <li><a href="#team"><i class="fas fa-users"></i> Team</a></li>
        <li><a href="#contact"><i class="fas fa-envelope"></i> Contact</a></li>
        <li><a href="rejister.html"><i class="fas fa-book"></i> Booking</a></li>
    </ul>
</nav>
<div class="container">
    <h2 class="text-center mb-4">Your Booked Tours</h2>
    <div class="table-container">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>Tour Name</th>
                <th>Location</th>
                <th>Duration (Days)</th>
                <th>Tour Type</th>
                <th>Price</th>
                <th>Available Seats</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Book</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="bookingsTableBody">
            </tbody>
        </table>
        <button class="clear-btn" onclick="clearBookings()">Clear All Bookings</button>
    </div>
</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {
        displayBookedTours();
        updateTourSeats();
    });

    function displayBookedTours() {
        let bookings = JSON.parse(localStorage.getItem("selectedTours")) || [];
        const tableBody = document.getElementById("bookingsTableBody");

        if (bookings.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='10'>No tours booked yet.</td></tr>";
            return;
        }

        tableBody.innerHTML = "";
        bookings.forEach((tour, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${tour.tourName}</td>
                <td>${tour.location}</td>
                <td>${tour.duration}</td>
                <td>${tour.tourType}</td>
                <td>$${tour.price}</td>
                <td>
                    <button class="seat-btn" onclick="updateSeats(${index}, -1)">-</button>
                    <span id="seats-${index}">${tour.availableSeats}</span>
                    <button class="seat-btn" onclick="updateSeats(${index}, 1)">+</button>
                </td>
                <td>${new Date(tour.startDate).toLocaleDateString()}</td>
                <td>${new Date(tour.endDate).toLocaleDateString()}</td>
                <td><button class="book-btn" onclick="bookTour(${index})">Book</button></td>
                <td><button class="remove-btn" onclick="removeBooking(${index})">Remove</button></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function updateSeats(index, change) {
        let bookings = JSON.parse(localStorage.getItem("selectedTours")) || [];
        let originalTours = JSON.parse(localStorage.getItem("allTours")) || [];

        if (bookings[index]) {
            let newSeats = bookings[index].availableSeats + change;
            if (newSeats >= 0) {
                bookings[index].availableSeats = newSeats;
                localStorage.setItem("selectedTours", JSON.stringify(bookings));
                document.getElementById(`seats-${index}`).textContent = newSeats;

                for (let i = 0; i < originalTours.length; i++) {
                    if (originalTours[i].tourName === bookings[index].tourName) {
                        originalTours[i].availableSeats = newSeats;
                        break;
                    }
                }
                localStorage.setItem("allTours", JSON.stringify(originalTours));
            }
        }
    }

    function bookTour(index) {
        let isLoggedIn = localStorage.getItem("isLoggedIn");
        if (!isLoggedIn) {
            window.location.href = "log.html";
        } else {
            alert("Tour booked successfully!");
        }
    }

    function removeBooking(index) {
        let bookings = JSON.parse(localStorage.getItem("selectedTours")) || [];
        let originalTours = JSON.parse(localStorage.getItem("allTours")) || [];

        let removedTour = bookings[index];

        bookings.splice(index, 1);
        localStorage.setItem("selectedTours", JSON.stringify(bookings));

        for (let i = 0; i < originalTours.length; i++) {
            if (originalTours[i].tourName === removedTour.tourName) {
                originalTours[i].availableSeats += removedTour.availableSeats;
                break;
            }
        }
        localStorage.setItem("allTours", JSON.stringify(originalTours));

        displayBookedTours();
    }

    function clearBookings() {
        let bookings = [];
        let originalTours = JSON.parse(localStorage.getItem("allTours")) || [];

        for (let i = 0; i < originalTours.length; i++) {
            originalTours[i].availableSeats = originalTours[i].totalSeats;
        }

        localStorage.setItem("selectedTours", JSON.stringify(bookings));
        localStorage.setItem("allTours", JSON.stringify(originalTours));

        displayBookedTours();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
