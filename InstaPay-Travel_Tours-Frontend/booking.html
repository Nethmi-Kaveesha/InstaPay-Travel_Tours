            padding: 0;

        }

    </style>
</head>
<body>
<div class="navbar-all-in-one fixed-top">
    <div class="navbar-top">
        <div class="content">
            <span><i class="fas fa-map-marker-alt icon"></i>No 333 2/2, Galle Road, Colombo 03</span>
            <span><i class="fas fa-phone icon"></i>011 257 4646</span>
            <span><i class="fas fa-link icon"></i> <a href="https://yourwebsite.com" class="text-white">marketing@travelco.lk</a></span>
        </div>
        <div class="social-media-icons">
            <a href="#" class="icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="icon"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="icon"><i class="fab fa-instagram"></i></a>
        </div>
    </div>


    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">
            <img src="images/Travelco-Footer-Logo.webp" alt="Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home</a>

            </ul>
        </div>
    </nav>
    <button class="go-back-btn" onclick="goBack()">
        <i class="bi bi-arrow-left"></i> Go Back
    </button>
</div>
<div class="container">
    <h2>Reserve Your Trip</h2>
    <form id="bookingForm">
        <div class="inline-fields">
            <div class="input-group">
                <label for="uid">👤  Explorer's Name</label>
                <select id="uid" required>
                    <option value="">Select Explorer's Name</option>
                </select>
            </div>
            <div class="input-group">
                <label for="bookingDate">🗓️  Pick Your Travel Date</label>
                <input type="date" id="bookingDate" required>
            </div>
            <div class="input-group">
                <label for="totalPrice">💳 Bill Total</label>
                <input type="number" id="totalPrice" step="0.01" required>
            </div>
        </div>


        <h3>Booking Details</h3>
        <div id="bookingDetails">
            <div class="booking-detail">
                <label>✈️  Expedition</label>
                <select class="tourDropdown" required>
                    <option value="">Select a Tour</option>
                </select>

                <div class="inline-inputs">
                    <div class="input-group">
                        <label>💺  Remaining Seat</label>
                        <input type="number" class="quantity" required>
                    </div>


                    <div class="input-group">
                        <label>🛂  Fare</label>
                        <input type="number" class="price" step="0.01" required readonly>
                    </div>
                </div>


                <button type="button" class="removeDetail">Unbook</button>
            </div>


            <button type="button" id="addDetail">Provide Additional Information</button>

            <button type="button" id="payNowButton" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal">Pay Now</button>

            <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="paymentModalLabel">Confirm Payment</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="paymentForm">
                                <div class="mb-3">
                                    <label for="cardNumber" class="form-label">Card Number</label>
                                    <input type="text" class="form-control" id="cardNumber" required>
                                </div>
                                <div class="mb-3">
                                    <label for="cardName" class="form-label">Cardholder's Name</label>
                                    <input type="text" class="form-control" id="cardName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="expiry" class="form-label">Expiry Date</label>
                                    <input type="text" class="form-control" id="expiry" placeholder="MM/YY" required>
                                </div>
                                <div class="mb-3">
                                    <label for="cvv" class="form-label">CVV</label>
                                    <input type="text" class="form-control" id="cvv" required>
                                </div>
                                <div class="mb-3">
                                    <label for="amount" class="form-label">Amount</label>
                                    <input type="text" class="form-control" id="amount">
                                </div>
                                <div class="mb-3">
                                    <label for="bookingId" class="form-label">Booking ID</label>
                                    <input type="text" class="form-control" id="bookingId">
                                </div>
                                <button type="button" class="btn btn-primary" onclick="confirmPayment()">Confirm Payment</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>


            <button type="submit">Finalize Reservation</button>
    </form>


    <p id="responseMessage"></p>
</div>


<script src="js/booking.js"></script>
<script>
    function goBack() {
        window.history.back();
    }

</script>
</body>
</html>
