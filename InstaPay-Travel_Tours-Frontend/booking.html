<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Booking</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url("images/1000_F_120022199_oWkco1KRUa7jm7Swcp1AIULfKnA2lNDP.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            color: #333;
            font-weight: bold;
        }



        .container {
            width: 80%;
            max-width: 900px;
            margin: 120px auto;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 20px;
            color: #444;
            margin-bottom: 10px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .booking-detail {
            padding: 15px;
            background-color: #f9f9f9;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .removeDetail {
            background-color: #e74c3c;
            padding: 6px 12px;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .removeDetail:hover {
            background-color: #c0392b;
        }

        #responseMessage {
            text-align: center;
            font-size: 16px;
            color: #2ecc71;
            margin-top: 20px;
        }

        #userId option {
            color: black;
        }

        @media screen and (max-width: 768px) {
            .container {
                width: 90%;
            }

            h2 {
                font-size: 22px;
            }

            button {
                width: 100%;
            }

            .removeDetail {
                width: 100%;
            }

            input[type="text"],
            input[type="date"],
            input[type="number"],
            select {
                font-size: 16px;
            }
        }

        /* Add detail button */
        #addDetail {
            display: block;
            width: 100%;
            background-color: #2ecc71;
            padding: 10px;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        #addDetail:hover {
            background-color: #27ae60;
        }
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .popup-content {
            background-color: white;
            width: 350px;
            padding: 20px;
            margin: 100px auto;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Flex container for inline inputs */
        .inline-inputs {
            display: flex;
            gap: 20px; /* Adjust space between inputs */
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1; /* Make inputs take equal space */
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Flex container for the inline form fields */
        .inline-fields {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1 1 calc(33% - 10px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .input-group input,
        .input-group select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #3498db;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #2980b9;
        }

        @media screen and (max-width: 768px) {
            .inline-fields {
                flex-direction: column;
                gap: 15px;
            }

            .input-group {
                flex: 1 1 100%;
            }
        }

        .navbar-top {
            background-color: black;
            color: white;
            padding: 5px 0;
            z-index: 1000;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar-top .icon {
            color: lightskyblue;
            margin-left: 10px;
        }

        .navbar-top .content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .navbar-top .content span {
            margin-right: 20px;
        }

        .social-media-icons {
            display: flex;
            justify-content: flex-end;
            margin-right: 100px;
            margin-top: -17px;
        }

        .social-media-icons a {
            color: white !important;
            margin-left: 30px;
            font-size: 16px;
        }


        .navbar {
            background-color: white;
            height: 50px;
            padding: 5px 0;
            z-index: 90999;
            width: 100%;
            position: fixed;
            top: 60px;
        }

        .navbar .navbar-nav {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .navbar .navbar-nav .nav-item {
            margin: 0 15px;
        }

        .navbar .navbar-nav .nav-item .nav-link {
            padding: 5px 10px;
            color: black;
            font-weight: bold;
        }

        .navbar .navbar-nav .nav-item .nav-link:hover {
            color: blue;
        }

        .navbar .navbar-nav .nav-item {
            margin-right: 20px;
        }

        .navbar-brand img {
            margin-left: 50px;
            height: 120px;
            margin-top: 45px;
            width: auto;
        }

        .navbar-all-in-one {
            background-color: white;
            height: 100px;

        }

    </style>
</head>

<body>

    <div class="navbar-top">

    <nav class="navbar navbar-expand-lg navbar-light bg-light">

        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home</a>
                </li>

        </div>
    </nav>
</div>
<div class="container">
    <h2>Reserve Your Trip</h2>
    <form id="bookingForm">
        <div class="inline-fields">
            <div class="input-group">
                <label for="uid">👤  Explorer's Name</label>
                <select id="uid" required>
                    <option value="">Select Explorer's Name</option>
                </select>
            </div>
            <div class="input-group">
                <label for="bookingDate">🗓️  Pick Your Travel Date</label>
                <input type="date" id="bookingDate" required>
            </div>
            <div class="input-group">
                <label for="totalPrice">💳 Bill Total</label>
                <input type="number" id="totalPrice" step="0.01" required>

        <h3>Booking Details</h3>
        <div id="bookingDetails">
            <div class="booking-detail">
                <label>✈️  Expedition</label>
                <select class="tourDropdown" required>
                    <option value="">Select a Tour</option>
                </select>

                <!-- Flex container for inline inputs -->
                <div class="inline-inputs">
                    <div class="input-group">
                        <label>💺  Remaining Seat</label>
                        <input type="number" class="quantity" required>
                    </div>

                    <div class="input-group">
                        <label>🛂  Fare</label>
                        <input type="number" class="price" step="0.01" required readonly>
                    </div>
                </div>

                <button type="button" class="removeDetail">Unbook</button>
            </div>


            <button type="button" id="addDetail">Provide Additional Information</button>

        <button type="submit">Finalize Reservation</button>
    </form>

    <p id="responseMessage"></p>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const bookingForm = document.getElementById("bookingForm");
        const bookingDetailsContainer = document.getElementById("bookingDetails");

        fetchUsers();

        function fetchUsers() {
            fetch("http://localhost:8080/api/v1/user/getAll")
                .then(response => response.json())
                .then(data => {
                    const userIdDropdown = document.getElementById("uid");
                    data.forEach(user => {
                        const option = document.createElement("option");
                        option.value = user.uid;
                        option.textContent = user.name;
                        userIdDropdown.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error("Error fetching users:", error);
                    Swal.fire("Error", "Failed to load users.", "error");
                });
        }

        fetchTours();

        function fetchTours() {
            fetch("http://localhost:8080/api/v1/tours/getAll")
                .then(response => response.json())
                .then(data => {
                    const tourDropdowns = document.querySelectorAll(".tourDropdown");
                    tourDropdowns.forEach(dropdown => {
                        dropdown.innerHTML = '<option value="">Select a Tour</option>';
                        data.forEach(tour => {
                            const option = document.createElement("option");
                            option.value = tour.tourID;
                            option.textContent = tour.tourName;
                            option.dataset.price = tour.price;
                            dropdown.appendChild(option);
                        });
                    });
                })
                .catch(error => {
                    console.error("Error fetching tours:", error);
                    Swal.fire("Error", "Failed to load tours.", "error");
                });
        }

        document.getElementById("addDetail").addEventListener("click", function () {
            const detailDiv = document.createElement("div");
            detailDiv.classList.add("booking-detail");

            detailDiv.innerHTML = `
        <label>Tour:</label>
        <select class="tourDropdown" required>
            <option value="">Select a Tour</option>
        </select>

        <label>Quantity:</label>
        <input type="number" class="quantity" required>

        <label>Price:</label>
        <input type="number" class="price" step="0.01" required readonly>

        <button type="button" class="removeDetail">Remove</button>
    `;

            fetchTours();
            bookingDetailsContainer.appendChild(detailDiv);
        });

        bookingDetailsContainer.addEventListener("change", function (event) {
            if (event.target.classList.contains("tourDropdown")) {
                const selectedOption = event.target.selectedOptions[0];
                const price = parseFloat(selectedOption.dataset.price) || 0;
                const quantityInput = event.target.closest(".booking-detail").querySelector(".quantity");
                const priceInput = event.target.closest(".booking-detail").querySelector(".price");

                priceInput.value = price;

                updateTotalPrice();
            }
            if (event.target.classList.contains("quantity")) {
                updateTotalPrice();
            }
        });

        function updateTotalPrice() {
            let total = 0;
            document.querySelectorAll(".booking-detail").forEach(detail => {
                const quantity = parseFloat(detail.querySelector(".quantity").value) || 0;
                const price = parseFloat(detail.querySelector(".price").value) || 0;
                total += quantity * price;
            });
            document.getElementById("totalPrice").value = total.toFixed(2);
        }

        bookingDetailsContainer.addEventListener("click", function (event) {
            if (event.target.classList.contains("removeDetail")) {
                event.target.closest(".booking-detail").remove();
                updateTotalPrice();
            }
        });

        bookingForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const userId = document.getElementById("uid").value;
            const bookingDate = document.getElementById("bookingDate").value;
            const totalPrice = document.getElementById("totalPrice").value;

            if (!userId || !bookingDate || !totalPrice) {
                Swal.fire("Error", "Please fill in all the required fields.", "error");
                return;
            }

            // Prepare booking details array
            const bookingDetails = [];
            document.querySelectorAll(".booking-detail").forEach(detail => {
                const tourId = detail.querySelector(".tourDropdown").value;
                const quantity = detail.querySelector(".quantity").value;
                const price = detail.querySelector(".price").value;

                if (tourId && quantity && price) {
                    bookingDetails.push({
                        tourId,
                        quantity,
                        price
                    });
                }
            });

            // Submit booking data
            const bookingData = {
                userId,
                bookingDate,
                totalPrice,
                bookingDetails
            };

            fetch("http://localhost:8080/api/v1/booking/place", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bookingData)
            })
                .then(response => response.json())
                .then(data => {
                    Swal.fire({
                        icon: "success",
                        title: "Success!",
                        text: "Your booking has been confirmed!",
                        showCancelButton: true,
                        confirmButtonText: "Go to Payment",
                        cancelButtonText: "Stay Here",
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = "payment.html";
                        }
                    });
                    bookingForm.reset();
                })
                .catch(error => {
                    console.error("Error submitting booking:", error);
                    Swal.fire({
                        icon: "error",
                        title: "Oops...",
                        text: "Failed to place booking!",
                    });
                });
        });
    });

</script>
</body>
