<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }
        .container {
            margin-top: 30px;
            padding: 20px;
        }
        .card {
            padding: 30px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .card-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            border-radius: 25px;
            font-size: 1.1rem;
            padding: 12px;
            border: none;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
        .navbar {
            background-color: #343a40;
            padding: 10px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
        }
        .navbar a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="#">Home</a>
    <a href="#">Profile</a>
    <a href="#">Settings</a>
    <a href="login.html" class="ml-auto">Logout</a>
</nav>

<!-- Dashboard Content -->
<div class="container">
    <div class="card">
        <h3 class="card-title">Welcome to Your Dashboard</h3>
        <p>You are successfully logged in!</p>
        <p>Below are some of the actions you can perform:</p>
        <ul>
            <li>View your Profile</li>
            <li>Manage your Settings</li>
            <li>Access Payment History</li>
        </ul>
        <a href="placeBooking.html" class="btn btn-custom">Go to Payment</a>
    </div>
</div>

</body>
</html>
