<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/language-translator.css">
</head>
<body>

<div class="container">
    <div class="wrapper">
        <div class="text-input">
            <textarea class="from-text" placeholder="Enter text"></textarea>
            <textarea class="from-to" placeholder="Translation" readonly disabled></textarea>
        </div>
        <ul class="controls">
            <li class="row from">
                <div class="icons">
                    <i class="fas fa-volume-up"></i>
                    <i class="fas fa-copy"></i>
                </div>
                <select>
                    <option value="hi-IN">Hindi</option>
                    <option value="ne-NP">Nepal</option>
                    <option value="en-US">English</option>
                </select>
            </li>
            <li class="exchange"><i class="fas fa-exchange-alt"></i></li>
            <li class="row to">
                <select>
                    <option value="hi-IN">Hindi</option>
                    <option value="ne-NP">Nepal</option>
                    <option value="en-US">English</option>
                </select>
                <div class="icons">
                    <i class="fas fa-volume-up"></i>
                    <i class="fas fa-copy"></i>
                </div>
            </li>
        </ul>
    </div>
    <button>Translate Text</button>
</div>


<script src="js/language-translator.js"></script>

</body>
</html>
