<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Records</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .table {
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Payment Records</h2>
    <table class="table table-striped" id="paymentTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Payment ID</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Tour Name</th>
        </tr>
        </thead>
        <tbody>
        <!-- Payment data will be inserted here via JavaScript -->
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function() {
        // Show the loading message before making the request
        $('#loadingMessage').show();

        // AJAX request to fetch payment data
        $.ajax({
            url: 'http://localhost:8080/api/payments/view', // Correct API endpoint for fetching payments
            method: 'GET',
            success: function (data) {
                console.log(data);  // Check the structure of the response
                if (Array.isArray(data)) {
                    let tableBody = $('#paymentTable tbody');
                    tableBody.empty();  // Clear any existing rows

                    // Loop through the array and add rows to the table
                    data.forEach(function (payment) {
                        let row = `<tr>
        <td>${payment.id}</td>
        <td>${payment.email}</td>
        <td>${payment.paymentId}</td>
        <td>${payment.status}</td>
        <td>${payment.amount}</td>
        <td>${payment.tourName}</td>
    </tr>`;
                        tableBody.append(row);
                    });

                } else {
                    console.error('Expected an array but received:', data);
                }
            },
            error: function (err) {
                console.log('Error fetching payment data:', err);
            }
        });
    });
</script>

</body>
</html>
