<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Updates & Local Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome Link -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e7f2f7;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            font-size: 36px;
            color: #2c3e50;
            margin-top: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        #weather-info {
            margin-top: 20px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            transition: all 0.3s ease;
            text-align: center;
        }

        #weather-info h3 {
            color: #34495e;
            font-size: 28px;
            margin-bottom: 15px;
        }

        #weather-info p {
            font-size: 18px;
            color: #7f8c8d;
        }

        #weather-info i {
            font-size: 100px;
            margin-top: 20px;
            transition: color 0.3s ease;
        }

        /* Custom color styles for weather icons */
        .sunny {
            color: #f39c12;  /* Yellow */
        }

        .cloudy {
            color: #95a5a6;  /* Grey */
        }

        .rainy {
            color: #3498db;  /* Blue */
        }

        .snowy {
            color: #ecf0f1;  /* Light Grey/White */
        }

        /* Input and button for weather */
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        #city {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 250px;
            max-width: 80%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .local-guide-btn {
            background-color: #2ecc71;
        }

        .local-guide-btn:hover {
            background-color: #27ae60;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            #city {
                width: 200px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Weather Updates & Local Guide</h2>

    <!-- Input and button for weather -->
    <div class="input-group">
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="fetchWeather()">Get Weather</button>
    </div>

    <!-- Weather Info Display -->
    <div id="weather-info"></div>

    <!-- Local Guide Button -->
    <button class="local-guide-btn" onclick="getLocalGuide()">Local Guide</button>
</div>

<script>
    function getLocalGuide() {
        let city = document.getElementById("city").value;
        if (!city) {
            alert("Please enter a city name");
            return;
        }
        window.open(`https://www.google.com/search?q=best+places+to+visit+in+${city}`, "_blank");
    }

    function fetchWeather() {
        let city = document.getElementById("city").value;
        if (!city) {
            alert("Please enter a city name");
            return;
        }

        fetch(`http://localhost:8080/api/weather/${city}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Weather Data:", data); // Debugging
                let weatherCondition = data.weather[0].main.toLowerCase();
                let weatherIcon = getWeatherIcon(weatherCondition);

                document.getElementById("weather-info").innerHTML = `
                        <h3>Weather in ${data.name}</h3>
                        <p>Temperature: ${data.main.temp}°C</p>
                        <p>Humidity: ${data.main.humidity}%</p>
                        <p>Weather: ${data.weather[0].description}</p>
                        <i class="${weatherIcon}"></i>
                    `;
            })
            .catch(error => {
                console.error("Error fetching weather data:", error);
                document.getElementById("weather-info").innerHTML = "<p>Error fetching data. Check console.</p>";
            });
    }

    function getWeatherIcon(condition) {
        switch (condition) {
            case 'clear':
                return 'fas fa-sun sunny';
            case 'clouds':
                return 'fas fa-cloud cloudy';
            case 'rain':
                return 'fas fa-cloud-rain rainy';
            case 'snow':
                return 'fas fa-snowflake snowy';
            default:
                return 'fas fa-cloud-sun cloudy';
        }
    }
</script>

</body>
</html>
