<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Details</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .tour-header {
            text-align: center;
            height: 80px;
            margin-bottom: 20px;
            padding: 10px 0;
            background-color: #2c3e50;
            border-radius: 20px;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .tour-header h1 {
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: -2px;
        }

        .tour-header p {
            font-size: 18px;
            color: #ecf0f1;
            letter-spacing: 1px;
        }

        .card {
            border-radius: 15px;
        }

        .tour-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .card-body {
            background-color: #ecf0f1;
            border-radius: 15px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
        }

        .card-text, .tour-info p {
            font-size: 16px;
            color: #34495e;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
            color: #e67e22;
        }

        .book-now-btn {
            background-color: #e67e22;
            color: #fff;
            padding: 9px 25px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .book-now-btn:hover {
            background-color: #d35400;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 30px;
            background-color: #2c3e50;
            color: #fff;
        }

        nav {
            background: #333;
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 333310;
        }

        nav ul {
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            padding: 10px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav .logo {
            width: 150px;
            height: auto;
            margin-right: 20px;
        }

    </style>
</head>
<body>
<nav>
    <ul>
        <li><img src="images/new-logo.png" alt="Logo" class="logo"></li>
        <li><a href="#home"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="#services"><i class="fas fa-cogs"></i> Services</a></li>
        <li><a href="#about"><i class="fas fa-info-circle"></i> About Us</a></li>
        <li><a href="#team"><i class="fas fa-users"></i> Team</a></li>
        <li><a href="#contact"><i class="fas fa-envelope"></i> Contact</a></li>
        <li><a href="rejister.html"><i class="fas fa-book"></i> Booking</a></li>
    </ul>
</nav>
<div class="container">
    <div class="tour-header">
        <h1>Exclusive Tour Details</h1>
        <p>Indulge in luxury experiences with our curated tours.</p>
    </div>
    <div id="tours" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("http://localhost:8080/api/v1/tours/getAll")
            .then(response => response.ok ? response.json() : Promise.reject("Failed to load"))
            .then(tours => {
                const toursContainer = document.getElementById("tours");
                toursContainer.innerHTML = tours.length ? "" : "<p>No tours available.</p>";
                tours.forEach(tour => {
                    const imageUrl = tour.images || 'images/default-tour.jpg';
                    const tourSection = document.createElement("div");
                    tourSection.classList.add("col");
                    tourSection.innerHTML = `
                        <div class="card shadow-sm h-100">
                            <img class="tour-image card-img-top" src="${imageUrl}" alt="Tour Image">
                            <div class="card-body">
                                <h5 class="card-title">${tour.tourName}</h5>
                                <p class="card-text">${tour.location}</p>
                                <div class="tour-info">
                                    <p><strong>Description:</strong> ${tour.description}</p>
                                    <p><strong>Duration:</strong> ${tour.duration} days</p>
                                    <p><strong>Tour Type:</strong> ${tour.tourType}</p>
                                    <p><strong>Price:</strong> <span class="price">$${tour.price}</span></p>
                                    <p><strong>Available Seats:</strong> ${tour.availableSeats}</p>
                                    <p><strong>Start Date:</strong> ${new Date(tour.startDate).toLocaleDateString()}</p>
                                    <p><strong>End Date:</strong> ${new Date(tour.endDate).toLocaleDateString()}</p>
                                </div>
                                <button class="book-now-btn" onclick='bookTour(${JSON.stringify(tour)})'>Book Now</button>
                            </div>
                        </div>`;
                    toursContainer.appendChild(tourSection);
                });
            })
            .catch(error => {
                document.getElementById("tours").innerHTML = "<p>Error loading tours.</p>";
                console.error("Error fetching tour data:", error);
            });
    });

    function bookTour(tour) {
        let bookings = JSON.parse(localStorage.getItem("selectedTours")) || [];

        bookings.push(tour);

        localStorage.setItem("selectedTours", JSON.stringify(bookings));

        window.location.href = "TourBooking.html";
    }
    function addToBookings(selectedTour) {
        let bookings = JSON.parse(localStorage.getItem("selectedTours")) || [];

        const existingTour = bookings.find(tour => tour.tourName === selectedTour.tourName);

        if (existingTour) {
            alert("This tour is already booked! Redirecting to your booked tours...");
            window.location.href = "TourBooking.html";
            return;
        }


        bookings.push(selectedTour);
        localStorage.setItem("selectedTours", JSON.stringify(bookings));
        alert("Tour added successfully! Redirecting to your booked tours...");
        window.location.href = "TourBooking.html";
    }


</script>

<footer>
    <p>&copy; 2025 Elite Travel | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
