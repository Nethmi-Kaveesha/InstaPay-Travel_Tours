<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center p-5">
<div class="container mt-4">
  <h1 class="text-center">Real-Time Chat</h1>
  <div id="chat" class="border rounded p-3 mb-3"
       style="height: 300px; overflow-y: auto;">
  </div>
  <div class="input-group mb-3">
    <input id="senderInput" type="text" class="form-control" placeholder="Your name...">
  </div>

  <div class="input-group mb-3">
    <input id="messageInput" type="text" class="form-control" placeholder="Type a message...">
    <div id="input-group-append">
      <button id="sendMessage" class="btn btn-primary">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var stompClient = null;

  function setConnected(connected) {
    document.getElementById('sendMessage').disabled = !connected;
  }

  function connect() {
    // Make sure the WebSocket URL matches your Spring Boot WebSocket endpoint
    var socket = new SockJS('http://localhost:8080/chat'); // WebSocket URL for your backend
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
      console.log("Connected: " + frame);
      setConnected(true);

      // Subscribe to the topic where messages will be sent
      stompClient.subscribe('/topic/message', function (message) {
        showMessage(JSON.parse(message.body));
      });
    });
  }

  function showMessage(message) {
    var chat = document.getElementById('chat');
    var messageElement = document.createElement('div');
    messageElement.textContent = message.sender + ": " + message.content;
    messageElement.classList.add("border-bottom", "mb-1");
    chat.appendChild(messageElement);
    chat.scrollTop = chat.scrollHeight; // Auto scroll to the bottom when a new message is added
  }

  function sendMessage() {
    var sender = document.getElementById('senderInput').value;
    var content = document.getElementById('messageInput').value;

    if (!sender || !content) {
      alert("Please enter both your name and a message!");
      return;
    }

    // Create a message object to send to the backend
    var chatMessage = {
      sender: sender,
      content: content
    };

    // Send the message to the backend WebSocket endpoint
    stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
    document.getElementById('messageInput').value = ''; // Clear message input field
  }

  // Bind the Send button click event
  document.getElementById('sendMessage').onclick = sendMessage;

  // Connect when the page loads
  window.onload = connect;
</script>
</body>
</html>
