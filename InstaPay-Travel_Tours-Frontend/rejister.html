        .form-control {

        }

        select.form-control:focus {

        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {

        }

        .login-link a:hover {

        .navbar-top .content {

        .social-media-icons a {

        .navbar {

        .navbar .navbar-nav {
            display: flex;

        .navbar .navbar-nav .nav-item {

        .navbar .navbar-nav .nav-item .nav-link {

<body>

    <div class="navbar-top">
        <div class="content">

            <a href="#" class="icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="icon"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" class="icon"><i class="fab fa-instagram"></i></a>

    </div>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">
            <img src="images/Travelco-Footer-Logo.webp" alt="Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

                    <a class="nav-link" href="rejister.html">Booking</a>
                </li>

        </div>
    </nav>
</div>

<div class="container d-flex justify-content-center align-items-center">
    <div class="form-container">
        <h2 class="form-title">Register</h2>
        <form id="registerForm" onsubmit="return handleFormSubmit(event)">
            <div class="mb-3 icon-input">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control input-with-icon" id="name" name="name" placeholder="Enter your full name" required>
                <i class="fas fa-user"></i>
            </div>
            <div class="mb-3 icon-input">
                <label for="phoneNumber" class="form-label">Phone Number</label>
                <input type="text" class="form-control input-with-icon" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" required>
                <i class="fas fa-phone-alt"></i>
            </div>
            <div class="mb-3 icon-input">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control input-with-icon" id="email" name="email" placeholder="Enter your email" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="mb-3 icon-input">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control input-with-icon" id="password" name="password" placeholder="Enter your password" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="Admin">Admin</option>
                    <option value="User">User</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="gender" class="form-label">Gender</label><br>
                <input type="radio" id="male" name="gender" value="Male" class="form-check-input d-inline" required>
                <label for="male" class="form-check-label d-inline">Male</label>
                <input type="radio" id="female" name="gender" value="Female" class="form-check-input d-inline ms-3" required>
                <label for="female" class="form-check-label d-inline">Female</label>
                <input type="radio" id="other" name="gender" value="Other" class="form-check-input d-inline ms-3" required>
                <label for="other" class="form-check-label d-inline">Other</label>
            </div>

            <button type="submit" class="btn btn-register w-100">Register</button>
        </form>
        <div class="login-link">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
</div>

<script>
    function handleFormSubmit(event) {
        event.preventDefault();
        const formData = {
            name: document.getElementById('name').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
            gender: document.querySelector('input[name="gender"]:checked').value
        };
        $.ajax({
            url: 'http://localhost:8080/api/v1/user/register',
            type: 'POST',
            data: formData,
            success: function(response) {
                Swal.fire({
                    icon: 'success',
                    title: 'Registration Successful',
                    text: 'You have successfully registered!'
                }).then(function() {
                    window.location.href = "login.html";
                });
            },
            error: function(xhr, status, error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Registration Failed',
                    text: 'An error occurred during registration. Please try again.'
                });
            }
        });
    }
</script>

</body>
