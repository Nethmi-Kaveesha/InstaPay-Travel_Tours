<!-- bookings.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Bookings</h2>
    <table id="bookingTable" class="table table-striped">
        <thead>
        <tr>
            <th>Booking ID</th>
            <th>Booking Date</th>
            <th>Total Price</th>
            <th>User Name</th>
            <th>Tour Name</th>
            <th>Seats</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Table rows will be dynamically added here -->
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script>
    function loadBookingData() {
        $.ajax({
            url: 'http://localhost:8080/api/v1/booking/view',  // Updated endpoint
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                var tableBody = $('#bookingTable tbody');
                tableBody.empty();  // Clear existing rows

                data.forEach(function(booking) {
                    var row = $('<tr></tr>');
                    row.append('<td>' + booking.bookingId + '</td>');
                    row.append('<td>' + booking.bookingDate + '</td>');
                    row.append('<td>' + booking.totalPrice + '</td>');
                    row.append('<td>' + booking.userName + '</td>');
                    row.append('<td>' + booking.bookingDetails[0].tourName + '</td>'); // Assuming only one tour
                    row.append('<td>' + booking.bookingDetails[0].seats + '</td>'); // Same assumption
                    row.append('<td><button class="btn btn-info">View</button></td>');
                    tableBody.append(row);
                });
            },
            error: function(xhr, status, error) {
                console.error('Error loading booking data:', error);
                alert('Error loading booking data.');
            }
        });
    }

</script>
</body>
</html>
