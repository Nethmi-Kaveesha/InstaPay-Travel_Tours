<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right top, #141E30, #243B55);
            margin: 0;
            padding: 0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .container {
            width: 50%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h1, h2 {
            text-align: center;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            margin: auto;
        }


        input, textarea {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }


        button {
            background: linear-gradient(to right, #FF512F, #DD2476);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(to right, #DD2476, #FF512F);
        }

        #reviews-list {
            margin-top: 20px;
        }

        .review {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stars {
            display: flex;
            gap: 5px;
        }

        .star {
            width: 22px;
            height: 22px;
            background-color: #ccc;
            clip-path: polygon(50% 0%, 63% 35%, 98% 35%, 72% 57%, 79% 91%, 50% 70%, 21% 91%, 28% 57%, 2% 35%, 37% 35%);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .star.filled {
            background-color: #f39c12;
        }

    </style>
</head>

<body>
<div class="container">
    <h1>Submit Your Review</h1>

    <form id="review-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="rating">Rating (1 to 5):</label>
        <div id="rating-stars" class="stars"></div>
        <input type="hidden" id="rating" name="rating" required />

        <label for="comment">Comment:</label>
        <textarea id="comment" name="comment" rows="4" required></textarea>

        <button type="submit">Submit Review</button>
    </form>

    <h2>All Reviews</h2>
    <div id="reviews-list"></div>
</div>

<script>
    function loadReviews() {
        $.ajax({
            url: 'http://localhost:8080/reviews',
            method: 'GET',
            success: function (reviews) {
                let reviewsList = $('#reviews-list');
                reviewsList.empty();

                reviews.forEach(function (review) {
                    let stars = '';
                    for (let i = 1; i <= 5; i++) {
                        stars += `<span class="star ${i <= review.rating ? 'filled' : ''}"></span>`;
                    }

                    reviewsList.append(`
                        <div class="review">
                            <h3>${review.name} (${review.rating} stars)</h3>
                            <div class="stars">${stars}</div>
                            <p>${review.comment}</p>
                        </div>
                    `);
                });
            },
            error: function (error) {
                alert('Error loading reviews: ' + error.statusText);
            }
        });
    }

    $(document).ready(function () {
        loadReviews();

        for (let i = 1; i <= 5; i++) {
            $('#rating-stars').append(`<span class="star" data-value="${i}"></span>`);
        }

        $('#rating-stars').on('click', '.star', function () {
            const ratingValue = $(this).data('value');
            $('#rating').val(ratingValue);
            $('#rating-stars .star').each(function () {
                $(this).toggleClass('filled', $(this).data('value') <= ratingValue);
            });
        });
    });

    $('#review-form').submit(function (event) {
        event.preventDefault();

        var reviewData = {
            name: $('#name').val(),
            email: $('#email').val(),
            rating: $('#rating').val(),
            comment: $('#comment').val()
        };

        $.ajax({
            url: 'http://localhost:8080/reviews',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(reviewData),
            success: function () {
                loadReviews();
                $('#review-form')[0].reset();
                $('#rating-stars .star').removeClass('filled');
            },
            error: function (error) {
                alert('Error submitting review: ' + error.statusText);
            }
        });
    });
</script>
</body>
</html>
