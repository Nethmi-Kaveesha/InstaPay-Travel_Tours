<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Requests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        #error {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Payment Requests</h2>
<div id="error"></div>
<table id="paymentTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Booking ID</th>
        <th>Card Name</th>
        <th>Card Number</th>
        <th>CVV</th>
        <th>Expiry</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("http://localhost:8080/payment/getAll")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            })
            .then(data => {
                const tableBody = document.querySelector("#paymentTable tbody");
                tableBody.innerHTML = "";

                data.forEach(payment => {
                    const row = `
                            <tr>
                                <td>${payment.id}</td>
                                <td>${payment.amount}</td>
                                <td>${payment.bookingId}</td>
                                <td>${payment.cardName}</td>
                                <td>${payment.cardNumber}</td>
                                <td>${payment.cvv}</td>
                                <td>${payment.expiry}</td>
                            </tr>
                        `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                document.getElementById("error").textContent = "Failed to load payment data. " + error;
                console.error("Error fetching payment data:", error);
            });
    });
</script>

</body>
</html>
