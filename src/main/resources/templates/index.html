<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expense Tracker</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('body').addClass('loaded');
            $('a').on('click', function(e) {
                e.preventDefault();
                var link = $(this).attr('href');
                $('body').removeClass('loaded');
                setTimeout(function() {
                    window.location.href = link;
                }, 500);
            });
        });
    </script>
</head>
<body>
<div class="container">
    <h1 class="mt-5">Expense Tracker</h1>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Example static expense data -->
        <tr>
            <td>1</td>
            <td>Rent Payment</td>
            <td>$1200</td>
            <td>
                <a class="btn btn-primary btn-sm" href="/editExpense/1">
                    <i class="fas fa-pencil-alt"></i>
                </a>
                <a class="btn btn-danger btn-sm" href="/deleteExpense/1" onclick="return confirm('Are you sure you want to delete this expense?');">
                    <i class="fas fa-trash-alt"></i>
                </a>
            </td>
        </tr>
        <tr>
            <td>2</td>
            <td>Groceries</td>
            <td>$150</td>
            <td>
                <a class="btn btn-primary btn-sm" href="/editExpense/2">
                    <i class="fas fa-pencil-alt"></i>
                </a>
                <a class="btn btn-danger btn-sm" href="/deleteExpense/2" onclick="return confirm('Are you sure you want to delete this expense?');">
                    <i class="fas fa-trash-alt"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <h2>Total: <span>1350.00</span></h2>
    <a class="btn btn-success mt-3" href="add-expense.html">Add Expense</a>
</div>
</body>
</html>
