<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map Example</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        #searchBox {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #map {
            height: 500px;
        }
    </style>
</head>
<body>
<h2>My Location</h2>

<div>
    <input id="searchBox" class="controls" type="text" placeholder="Search for a place" />
</div>

<div id="map"></div>


<script
        async
        defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB5zQ1G2eCCcwShL2yXyE7goWja0pM5Y2U&callback=initMap">
</script>

<script src="/static/image/js/map.js"></script>
</body>
</html>
