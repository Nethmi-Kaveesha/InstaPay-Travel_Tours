<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Hotels in Sri Lanka</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        #searchBox {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #map {
            height: 500px;
        }
    </style>
</head>
<body>
<h2>Find the Best Hotels in Sri Lanka</h2>

<div>
    <input id="searchBox" class="controls" type="text" placeholder="Search for a hotel in Sri Lanka" />
</div>

<div id="map"></div>

<script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB5zQ1G2eCCcwShL2yXyE7goWja0pM5Y2U&callback=initMap">
</script>

<script>
    let map, service, infoWindow, searchBox;

    function initMap() {
        const sriLankaCenter = { lat: 7.8731, lng: 80.7718 };

        map = new google.maps.Map(document.getElementById("map"), {
            center: sriLankaCenter,
            zoom: 7
        });

        infoWindow = new google.maps.InfoWindow();

        loadBestHotels(sriLankaCenter);

        searchBox = new google.maps.places.SearchBox(document.getElementById("searchBox"));

        searchBox.setBounds(new google.maps.LatLngBounds(
            { lat: 5.8700, lng: 79.4700 },
            { lat: 9.8350, lng: 81.8800 }
        ));

        searchBox.addListener("places_changed", () => {
            const places = searchBox.getPlaces();
            if (places.length === 0) return;

            const place = places[0];

            const marker = new google.maps.Marker({
                position: place.geometry.location,
                map: map,
                title: place.name
            });

            infoWindow.setContent(`<strong>${place.name}</strong><br>${place.formatted_address || ""}`);
            infoWindow.open(map, marker);

            map.setCenter(place.geometry.location);
            map.setZoom(14);
        });
    }

    function loadBestHotels(center) {
        const request = {
            location: center,
            radius: 50000,
            type: ["lodging"]
        };

        service = new google.maps.places.PlacesService(map);

        service.nearbySearch(request, (results, status) => {
            if (status === google.maps.places.PlacesServiceStatus.OK) {
                for (let i = 0; i < results.length; i++) {
                    createMarker(results[i]);
                }
            }
        });
    }

    function createMarker(place) {
        const marker = new google.maps.Marker({
            map: map,
            position: place.geometry.location,
            title: place.name
        });

        google.maps.event.addListener(marker, "click", () => {
            infoWindow.setContent(`
                    <strong>${place.name}</strong><br>
                    Rating: ${place.rating || "N/A"} ⭐<br>
                    Address: ${place.vicinity || "Not Available"}
                `);
            infoWindow.open(map, marker);
        });
    }
</script>
</body>
</html>
